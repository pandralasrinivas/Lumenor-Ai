name: Frontend CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build React App
        run: npm run build

      - name: Upload Static Build
        uses: actions/upload-artifact@v4
        with:
          name: styleup-static-build
          path: frontend/build
          if-no-files-found: error
          retention-days: 7

      - name: Prepare CodeDeploy Bundle
        working-directory: .
        run: |
          mkdir -p deployment/frontend
          cp -R frontend/build deployment/frontend/build
          cp appspec.yml deployment/appspec.yml
          cp -R scripts deployment/scripts
          chmod +x deployment/scripts/*.sh

      - name: Upload CodeDeploy Bundle
        uses: actions/upload-artifact@v4
        with:
          name: styleup-codedeploy-bundle
          path: deployment
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy with CodeDeploy
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      CODEDEPLOY_APPLICATION: ${{ vars.CODEDEPLOY_APPLICATION }}
      CODEDEPLOY_DEPLOYMENT_GROUP: ${{ vars.CODEDEPLOY_DEPLOYMENT_GROUP }}
      CODEDEPLOY_S3_BUCKET: ${{ vars.CODEDEPLOY_S3_BUCKET }}
      CODEDEPLOY_S3_PREFIX: ${{ vars.CODEDEPLOY_S3_PREFIX || 'styleup' }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      BUNDLE_NAME: styleup-${{ github.sha }}.zip

    steps:
      - name: Validate Deployment Configuration
        run: |
          missing=0
          for name in AWS_REGION CODEDEPLOY_APPLICATION CODEDEPLOY_DEPLOYMENT_GROUP CODEDEPLOY_S3_BUCKET AWS_ROLE_TO_ASSUME; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is required for deployment."
              missing=1
            fi
          done
          exit "${missing}"

      - name: Download CodeDeploy Bundle
        uses: actions/download-artifact@v4
        with:
          name: styleup-codedeploy-bundle
          path: deployment

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create Deployment Archive
        run: |
          cd deployment
          zip -r "../${BUNDLE_NAME}" .

      - name: Upload Archive to S3
        run: |
          aws s3 cp "${BUNDLE_NAME}" "s3://${CODEDEPLOY_S3_BUCKET}/${CODEDEPLOY_S3_PREFIX}/${BUNDLE_NAME}"

      - name: Create CodeDeploy Deployment
        id: codedeploy
        run: |
          deployment_id="$(aws deploy create-deployment \
            --application-name "${CODEDEPLOY_APPLICATION}" \
            --deployment-group-name "${CODEDEPLOY_DEPLOYMENT_GROUP}" \
            --s3-location bucket="${CODEDEPLOY_S3_BUCKET}",key="${CODEDEPLOY_S3_PREFIX}/${BUNDLE_NAME}",bundleType=zip \
            --query deploymentId \
            --output text)"
          echo "deployment_id=${deployment_id}" >> "${GITHUB_OUTPUT}"
          echo "Created CodeDeploy deployment ${deployment_id}"

      - name: Wait for Deployment
        run: |
          aws deploy wait deployment-successful --deployment-id "${{ steps.codedeploy.outputs.deployment_id }}"
