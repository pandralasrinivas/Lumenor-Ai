version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "Installing React dependencies"
      - npm ci

  build:
    commands:
      - echo "Creating React production build"
      - npm run build
      - test -f build/index.html

  post_build:
    commands:
      - echo "React build completed successfully"

artifacts:
  files:
    - "build/**/*"
    - "appspec.yml"
    - "deploy/**/*"
    - "scripts/**/*"
